<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les visuels ASGC - Matthew Quéro</title>
    <meta name="description" content="La galerie complète des visuels de communication réalisés pour l'AS Ginglin Cesson : affiches, mockups, programmes et posts réseaux sociaux.">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://matthew-quero.github.io/asgc-tous-visuels.html">
    <meta property="og:title" content="Tous les visuels ASGC, Matthew Quéro">
    <meta property="og:description" content="La galerie complète des visuels de communication réalisés pour l'AS Ginglin Cesson.">
    <meta property="og:image" content="https://matthew-quero.github.io/img/og-image.jpg">

    <link rel="canonical" href="https://matthew-quero.github.io/asgc-tous-visuels.html">
    <link rel="icon" type="image/png" href="img/site/logo.png">
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/components.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body class="alt-page">

    <div class="nav-project">
        <a href="as-ginglin-cesson.html#ginglin-clubs" class="back-link">← Retour Ginglin</a>
    </div>

    <main>
    <header class="tv-header">
        <h1 class="tv-title">TOUS LES <span class="gh-accent">VISUELS</span></h1>
        <p class="tv-count" id="tvCount"></p>
    </header>

    <div class="tv-grid" id="tvGrid">
        <!-- Injecté par JS -->
    </div>

    <div id="lightbox" class="lb-hidden">
        <div class="lb-backdrop" id="lbBackdrop"></div>
        <button class="lb-nav lb-nav-prev lb-nav-hidden" id="lbNavPrev">&#8592;</button>
        <button class="lb-nav lb-nav-next lb-nav-hidden" id="lbNavNext">&#8594;</button>
        <div class="lb-box">
            <button class="lb-close" id="lbClose">✕</button>
            <div class="lb-img-wrap" id="lbImgWrap">
                <img id="lbImg" src="" alt="" draggable="false">
            </div>
            <div class="lb-footer">
                <p class="lb-caption" id="lbCaption"></p>
                <div class="lb-zoom-controls">
                    <button class="lb-zoom-btn" id="lbZoomOut">−</button>
                    <span class="lb-zoom-val" id="lbZoomVal">100%</span>
                    <button class="lb-zoom-btn" id="lbZoomIn">+</button>
                    <button class="lb-zoom-btn" id="lbZoomReset">↺</button>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script src="JS/components.js"></script>
    <script src="JS/ginglin-data.js"></script>
    <script src="JS/script.js"></script>

    <script>
    (function () {
        var grid    = document.getElementById('tvGrid');
        var countEl = document.getElementById('tvCount');
        var lb      = document.getElementById('lightbox');
        var lbImg   = document.getElementById('lbImg');
        var lbCaption = document.getElementById('lbCaption');
        var lbZoomVal = document.getElementById('lbZoomVal');
        var lbWrap  = document.getElementById('lbImgWrap');
        var scale = 1, panX = 0, panY = 0;
        var dragging = false, startX, startY;

        function setZoom(z) {
            scale = Math.min(4, Math.max(0.5, z));
            lbImg.style.transform = 'scale(' + scale + ') translate(' + (panX / scale) + 'px,' + (panY / scale) + 'px)';
            lbZoomVal.textContent = Math.round(scale * 100) + '%';
        }

        function openLb(src, title) {
            lbImg.src = src;
            lbImg.alt = title;
            lbCaption.textContent = title;
            scale = 1; panX = 0; panY = 0;
            lbImg.style.transform = '';
            lbZoomVal.textContent = '100%';
            lb.classList.remove('lb-hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLb() {
            lb.classList.add('lb-hidden');
            document.body.style.overflow = '';
        }

        document.getElementById('lbClose').addEventListener('click', closeLb);
        document.getElementById('lbBackdrop').addEventListener('click', closeLb);
        document.getElementById('lbZoomIn').addEventListener('click', function() { setZoom(scale + 0.25); });
        document.getElementById('lbZoomOut').addEventListener('click', function() { setZoom(scale - 0.25); });
        document.getElementById('lbZoomReset').addEventListener('click', function() { scale = 1; panX = 0; panY = 0; setZoom(1); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLb(); });

        lbWrap.addEventListener('wheel', function(e) {
            e.preventDefault();
            setZoom(scale + (e.deltaY < 0 ? 0.15 : -0.15));
        }, { passive: false });

        lbImg.addEventListener('mousedown', function(e) {
            if (scale <= 1) return;
            dragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            lbImg.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            lbImg.style.transform = 'scale(' + scale + ') translate(' + (panX / scale) + 'px,' + (panY / scale) + 'px)';
        });
        window.addEventListener('mouseup', function() { dragging = false; lbImg.style.cursor = ''; });

        countEl.textContent = GINGLIN_ALL.length + ' créations';

        var shuffled = GINGLIN_ALL.slice();
        for (var s = shuffled.length - 1; s > 0; s--) {
            var r = Math.floor(Math.random() * (s + 1));
            var tmp = shuffled[s]; shuffled[s] = shuffled[r]; shuffled[r] = tmp;
        }

        var allCards = [];
        var rowEls = [];
        var currentPerRow = null;

        function getPerRow() {
            return window.innerWidth <= 768 ? 2 : 5;
        }

        var gap = window.innerWidth <= 768 ? 6 : 8;

        function buildGrid() {
            var perRow = getPerRow();
            if (perRow === currentPerRow) return;
            currentPerRow = perRow;
            gap = window.innerWidth <= 768 ? 6 : 8;

            grid.innerHTML = '';
            allCards = [];
            rowEls = [];

            for (var i = 0; i < shuffled.length; i += perRow) {
                var chunk = shuffled.slice(i, i + perRow);
                var rowEl = document.createElement('div');
                rowEl.className = 'tv-row';
                rowEl.style.height = '280px';

                chunk.forEach(function(imgData) {
                    var card = document.createElement('div');
                    card.className = 'tv-card';
                    card.innerHTML = '<div class="tv-img-wrap"><img src="' + imgData.src + '" alt="' + imgData.title + '" loading="lazy"></div>';

                    card.addEventListener('click', function() { openLb(imgData.src, imgData.title); });
                    card.addEventListener('mouseenter', function() {
                        Array.from(card.parentElement.querySelectorAll('.tv-card')).forEach(function(c) {
                            if (c !== card) c.classList.add('tv-row-shrink');
                        });
                    });
                    card.addEventListener('mouseleave', function() {
                        allCards.forEach(function(c) { c.classList.remove('tv-row-shrink'); });
                    });

                    rowEl.appendChild(card);
                    allCards.push(card);
                });

                grid.appendChild(rowEl);
                rowEls.push(rowEl);
            }

            adjustRows();

            var loaded = 0;
            allCards.forEach(function(card) {
                var img = card.querySelector('img');
                function onLoad() { loaded++; if (loaded % perRow === 0 || loaded === allCards.length) adjustRows(); }
                if (img.complete && img.naturalWidth) { onLoad(); } else { img.addEventListener('load', onLoad); }
            });
        }

        function adjustRows() {
            var containerW = grid.offsetWidth;
            rowEls.forEach(function(rowEl) {
                var cards = Array.from(rowEl.querySelectorAll('.tv-card'));
                var totalRatio = 0;
                var ratios = [];
                cards.forEach(function(card) {
                    var img = card.querySelector('img');
                    var r = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1;
                    ratios.push(r);
                    totalRatio += r;
                });
                var gaps = (cards.length - 1) * gap;
                var h = Math.round((containerW - gaps) / totalRatio);
                rowEl.style.height = h + 'px';
                cards.forEach(function(card, j) { card.style.flexGrow = ratios[j]; });
            });
        }

        buildGrid();

        window.addEventListener('resize', function() {
            buildGrid();
            adjustRows();
        });
    })();
    </script>

</body>
</html>
