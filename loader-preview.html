<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader Draw</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="fonts/montserrat-black-b64.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #00C896;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 48px;
            font-family: sans-serif;
        }

        #svg-mq {
            width: 44vmin;
            height: auto;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-replay {
            padding: 11px 28px;
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.25);
            color: rgba(0, 0, 0, 0.45);
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
            transition: border-color 0.2s, color 0.2s;
        }
        .btn-replay:hover { border-color: rgba(0,0,0,0.6); color: rgba(0,0,0,0.75); }

        #status {
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <svg id="svg-mq" viewBox="0 0 220 130">
        <path id="path-m"
              fill="#000" fill-opacity="0"
              stroke="#000" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round">
        </path>
        <path id="path-q"
              fill="#fff" fill-opacity="0"
              stroke="#fff" stroke-width="3"
              stroke-linejoin="round" stroke-linecap="round">
        </path>
    </svg>

    <div class="controls">
        <button class="btn-replay" id="btn">Rejouer</button>
        <div id="status">Initialisation...</div>
    </div>

    <script>
        var mEl = document.getElementById('path-m');
        var qEl = document.getElementById('path-q');
        var mLen, qLen, ready = false;

        function play() {
            if (!ready) return;
            gsap.killTweensOf([mEl, qEl]);
            gsap.set(mEl, { strokeDasharray: mLen, strokeDashoffset: mLen, fillOpacity: 0, strokeOpacity: 1 });
            gsap.set(qEl, { strokeDasharray: qLen, strokeDashoffset: qLen, fillOpacity: 0, strokeOpacity: 1 });

            var tl = gsap.timeline({ delay: 0.3 });
            tl.to(mEl, { strokeDashoffset: 0, duration: 1.7, ease: 'power2.inOut' }, 0)
              .to(qEl, { strokeDashoffset: 0, duration: 1.7, ease: 'power2.inOut' }, 0.4)
              .to([mEl, qEl], { fillOpacity: 1, duration: 0.5, ease: 'power1.in'  }, 2.0)
              .to([mEl, qEl], { strokeOpacity: 0, duration: 0.3, ease: 'none'     }, 2.15);
        }

        try {
            /* Decode base64 → ArrayBuffer */
            var b64  = MONTSERRAT_BLACK_B64.replace(/\s/g, '');
            var bin  = atob(b64);
            var buf  = new ArrayBuffer(bin.length);
            var view = new Uint8Array(buf);
            for (var i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);

            var font     = opentype.parse(buf);
            var fSize    = 100;
            var baseline = 98;

            var mAdv   = (font.charToGlyph('M').advanceWidth / font.unitsPerEm) * fSize;
            var qAdv   = (font.charToGlyph('Q').advanceWidth / font.unitsPerEm) * fSize;
            var gap    = 10;
            var totalW = mAdv + gap + qAdv;
            var mX     = (220 - totalW) / 2;
            var qX     = mX + mAdv + gap;

            mEl.setAttribute('d', font.getPath('M', mX, baseline, fSize).toPathData(2));
            qEl.setAttribute('d', font.getPath('Q', qX, baseline, fSize).toPathData(2));

            mLen = mEl.getTotalLength();
            qLen = qEl.getTotalLength();

            ready = true;
            document.getElementById('status').textContent = 'Rejoue toutes les 4 s';
            play();
            setInterval(play, 4000);

        } catch (e) {
            document.getElementById('status').textContent = 'Erreur : ' + e.message;
            console.error(e);
        }

        document.getElementById('btn').addEventListener('click', play);
    </script>

</body>
</html>
